<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171411">
  <title>Luscinia Radio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #f3ede4;
      --muted: #a69f96;
      --accent: #df7149;
      --panel: #211d19;
      --cover-size: clamp(232px, 28vw, 318px);
      --near-x: clamp(205px, 25vw, 272px);
      --far-x: clamp(344px, 41vw, 448px);
      --motion: 780ms cubic-bezier(.2, .76, .16, 1);
    }

    html {
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 8%, rgba(141, 105, 71, .19), transparent 37%),
        linear-gradient(145deg, #15120f 0%, #0c0b0a 58%, #17130f 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .player {
      width: min(1080px, 100%);
      min-height: 100svh;
      padding: clamp(24px, 5vh, 56px) clamp(18px, 5vw, 56px) 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      isolation: isolate;
    }

    .player::before {
      content: "";
      position: absolute;
      inset: 3% 2%;
      z-index: -1;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.005));
      box-shadow: 0 45px 120px rgba(0,0,0,.36);
      pointer-events: none;
    }

    .brand {
      text-align: center;
      position: relative;
      z-index: 20;
    }

    .eyebrow {
      color: #a79a8b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .26em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4.6vw, 46px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.035em;
    }

    .stage {
      height: clamp(370px, 50vw, 510px);
      margin-top: clamp(12px, 2vh, 22px);
      position: relative;
      perspective: 1120px;
      perspective-origin: 50% 42%;
      overflow: hidden;
      user-select: none;
      touch-action: pan-y;
    }

    .rack-back {
      position: absolute;
      width: min(970px, 96%);
      height: 66%;
      left: 50%;
      bottom: 54px;
      transform: translateX(-50%) rotateX(-1deg);
      border-radius: 45% 45% 18px 18px / 13% 13% 18px 18px;
      background:
        radial-gradient(ellipse at 50% 92%, rgba(130,88,54,.16), transparent 42%),
        repeating-radial-gradient(ellipse at 50% 112%, rgba(255,255,255,.025) 0 1px, transparent 2px 35px),
        linear-gradient(180deg, #211c18, #0d0c0a);
      box-shadow:
        inset 0 1px rgba(255,255,255,.05),
        inset 0 -62px 84px rgba(0,0,0,.62),
        0 42px 75px rgba(0,0,0,.32);
    }

    .rack-back::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .25;
      background:
        repeating-linear-gradient(97deg, transparent 0 48px, rgba(255,255,255,.025) 49px, transparent 50px 84px),
        linear-gradient(105deg, transparent 20%, rgba(255,255,255,.05) 38%, transparent 52%);
    }

    .records {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .orbit-shadow {
      position: absolute;
      z-index: 1;
      width: min(900px, 92%);
      height: 168px;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%) rotateX(67deg);
      border: 2px solid rgba(181,121,76,.26);
      border-radius: 50%;
      background:
        repeating-radial-gradient(ellipse at center, transparent 0 31px, rgba(210,155,104,.08) 32px 34px),
        radial-gradient(ellipse at center, rgba(114,68,37,.32), rgba(21,15,11,.9) 66%, transparent 68%);
      box-shadow:
        inset 0 0 45px rgba(0,0,0,.65),
        0 30px 55px rgba(0,0,0,.46);
      pointer-events: none;
    }

    .orbit-shadow::before,
    .orbit-shadow::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit-shadow::before {
      width: 55%;
      height: 55%;
      border: 2px solid rgba(210,151,98,.13);
    }

    .orbit-shadow::after {
      width: 30px;
      height: 30px;
      background: radial-gradient(circle at 36% 30%, #d7a476, #6e4227 60%, #2e1b11 65%);
      box-shadow: 0 3px 10px rgba(0,0,0,.5);
    }

    .record-card {
      width: var(--cover-size);
      height: var(--cover-size);
      position: absolute;
      top: 47%;
      left: 50%;
      z-index: 3;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      transform-style: preserve-3d;
      transition:
        transform var(--motion),
        filter var(--motion),
        opacity var(--motion);
      will-change: transform, filter, opacity;
    }

    .record-card[data-slot="center"] {
      z-index: 10;
      cursor: default;
      opacity: 1;
      filter: grayscale(0) brightness(1);
      transform: translate3d(-50%, -62%, 155px) rotateY(0deg) scale(1);
      transform-origin: center center;
    }

    .record-card[data-slot="left-near"] {
      z-index: 6;
      opacity: .64;
      filter: grayscale(1) brightness(.62) contrast(.92);
      transform: translate3d(calc(-50% - var(--near-x)), -45%, -55px) rotateY(39deg) rotateZ(-1deg) scale(.76);
      transform-origin: right center;
    }

    .record-card[data-slot="right-near"] {
      z-index: 6;
      opacity: .64;
      filter: grayscale(1) brightness(.62) contrast(.92);
      transform: translate3d(calc(-50% + var(--near-x)), -45%, -55px) rotateY(-39deg) rotateZ(1deg) scale(.76);
      transform-origin: left center;
    }

    .record-card[data-slot="left-far"] {
      z-index: 3;
      opacity: .34;
      filter: grayscale(1) brightness(.42) contrast(.88);
      transform: translate3d(calc(-50% - var(--far-x)), -33%, -235px) rotateY(62deg) rotateZ(-2deg) scale(.58);
      transform-origin: right center;
    }

    .record-card[data-slot="right-far"] {
      z-index: 3;
      opacity: .34;
      filter: grayscale(1) brightness(.42) contrast(.88);
      transform: translate3d(calc(-50% + var(--far-x)), -33%, -235px) rotateY(-62deg) rotateZ(2deg) scale(.58);
      transform-origin: left center;
    }

    .record-card[data-slot="hidden"] {
      opacity: 0;
      pointer-events: none;
      transform: translate3d(-50%, -35%, -180px) scale(.55);
    }

    .record-card[data-slot="left-near"]:hover,
    .record-card[data-slot="right-near"]:hover {
      opacity: .82;
      filter: grayscale(.8) brightness(.76);
    }

    .record-card[data-slot="left-far"]:hover,
    .record-card[data-slot="right-far"]:hover {
      opacity: .52;
      filter: grayscale(.9) brightness(.55);
    }

    .record-card.is-wrapping {
      opacity: 0 !important;
      transition: none !important;
    }

    .record-card:focus-visible {
      outline: 2px solid #f3c4a5;
      outline-offset: 8px;
      border-radius: 4px;
    }

    .vinyl {
      width: 92%;
      height: 92%;
      position: absolute;
      top: 4%;
      right: -11%;
      z-index: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #171310 0 5.5%, #d2b28f 5.8% 11%, #161310 11.4% 15%, transparent 15.3%),
        repeating-radial-gradient(circle at 50% 50%, #141414 0 2px, #292827 3px, #0c0c0c 5px, #1d1d1c 7px);
      box-shadow: 10px 16px 28px rgba(0,0,0,.38);
      transition: right var(--motion), transform var(--motion), opacity var(--motion);
    }

    .vinyl::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 50%;
      background: conic-gradient(from 18deg, transparent 0 8%, rgba(255,255,255,.09) 11%, transparent 16% 47%, rgba(255,255,255,.055) 51%, transparent 56% 100%);
      mix-blend-mode: screen;
    }

    .record-card:not([data-slot="center"]) .vinyl {
      right: -4%;
      opacity: .42;
      transform: scale(.96);
    }

    .record-card[data-slot$="far"] .vinyl {
      right: 0;
      opacity: .16;
    }

    .sleeve {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      border-radius: 3px;
      background: #282420;
      box-shadow:
        1px 0 0 rgba(255,255,255,.25),
        5px 7px 0 -3px #81766a,
        8px 10px 0 -4px #28231f,
        15px 26px 36px rgba(0,0,0,.42);
      transform: translateZ(3px);
      transition: box-shadow var(--motion);
    }

    .sleeve::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(112deg, rgba(255,255,255,.13), transparent 16% 74%, rgba(0,0,0,.14)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
      mix-blend-mode: soft-light;
    }

    .sleeve::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.17);
      box-shadow: inset 0 0 28px rgba(0,0,0,.15);
      pointer-events: none;
    }

    .sleeve img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .record-card[data-slot="center"] .sleeve {
      box-shadow:
        1px 0 0 rgba(255,255,255,.3),
        5px 7px 0 -3px #96897b,
        9px 11px 0 -4px #29241f,
        20px 38px 58px rgba(0,0,0,.58);
    }

    /* 切歌：当前唱片先浮起，整组沿弧线旋转，新唱片再向前落位。 */
    .stage.is-lifting .record-card[data-slot="center"] {
      transform: translate3d(-50%, -68%, 215px) rotateX(-1deg) scale(1.045);
    }

    .stage.is-rotating .record-card[data-slot="center"] {
      opacity: .82;
      filter: grayscale(.72) brightness(.78);
      transform: translate3d(-50%, -47%, 20px) rotateY(0) scale(.86);
    }

    .stage.is-rotating .record-card[data-slot="center"] .vinyl {
      right: -3%;
      opacity: .5;
    }

    .stage.is-rotating .record-card[data-slot="center"] .sleeve {
      box-shadow:
        1px 0 0 rgba(255,255,255,.18),
        5px 7px 0 -3px #625b53,
        10px 18px 28px rgba(0,0,0,.36);
    }

    .rack-lip {
      position: absolute;
      left: 50%;
      bottom: 9px;
      z-index: 12;
      width: min(970px, 98%);
      height: 116px;
      transform: translateX(-50%) perspective(760px) rotateX(68deg);
      transform-origin: center;
      border-radius: 50%;
      background:
        repeating-radial-gradient(ellipse at center, transparent 0 52px, rgba(46,25,14,.28) 54px 57px),
        radial-gradient(ellipse at 50% 30%, #ad754d, #694127 62%, #2d1a10 74%);
      border: 2px solid rgba(215,157,108,.52);
      box-shadow: 0 28px 38px rgba(0,0,0,.58), inset 0 -15px 22px rgba(35,18,10,.38);
    }

    .rack-front {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 13;
      width: min(900px, 92%);
      height: 20px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        linear-gradient(180deg, #a16b45, #4b2d1b 86%);
      border-top: 1px solid rgba(238,187,137,.42);
      box-shadow: 0 18px 34px rgba(0,0,0,.5), inset 0 -4px 7px rgba(0,0,0,.3);
    }

    .details {
      min-height: 69px;
      margin-top: 2px;
      text-align: center;
      position: relative;
      z-index: 20;
    }

    .song-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 3vw, 30px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -.02em;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .song-artist {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .09em;
    }

    .details.is-changing .song-title,
    .details.is-changing .song-artist {
      opacity: 0;
      transform: translateY(5px);
    }

    .transport {
      width: min(490px, 94%);
      margin: 20px auto 0;
      position: relative;
      z-index: 20;
    }

    .progress-row {
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 10px;
      color: #847d75;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .time:last-child {
      text-align: right;
    }

    .progress {
      width: 100%;
      height: 3px;
      border-radius: 99px;
      appearance: none;
      background: linear-gradient(to right, var(--accent) var(--progress, 0%), #403a34 var(--progress, 0%));
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #efe8df;
      box-shadow: 0 1px 6px rgba(0,0,0,.35);
    }

    .progress::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #efe8df;
      box-shadow: 0 1px 6px rgba(0,0,0,.35);
    }

    .controls {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
    }

    .control {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      color: #dbd4cb;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 23px;
      line-height: 1;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .control:hover {
      transform: translateY(-2px);
      color: #fff;
      background: rgba(255,255,255,.08);
    }

    .control:active {
      transform: translateY(0) scale(.96);
    }

    .play {
      width: 58px;
      height: 58px;
      padding-left: 3px;
      color: #1b1714;
      background: #ece4da;
      border-color: #ece4da;
      font-size: 19px;
      box-shadow: 0 10px 26px rgba(0,0,0,.28);
    }

    .play:hover {
      color: #111;
      background: #fff9f0;
    }

    .play.is-playing {
      padding-left: 0;
      font-size: 17px;
      letter-spacing: -3px;
    }

    .hint {
      margin-top: 15px;
      text-align: center;
      color: #5f5953;
      font-size: 10px;
      letter-spacing: .08em;
    }

    audio {
      display: none;
    }

    @media (max-width: 700px) {
      :root {
        --cover-size: clamp(216px, 66vw, 282px);
        --near-x: clamp(156px, 47vw, 222px);
        --far-x: clamp(260px, 76vw, 350px);
      }

      .player {
        padding-inline: 10px;
      }

      .player::before {
        inset-inline: 8px;
        border-radius: 25px;
      }

      .stage {
        height: clamp(330px, 98vw, 420px);
        margin-top: 4px;
      }

      .record-card[data-slot="left-near"] {
        transform: translate3d(calc(-50% - var(--near-x)), -40%, -75px) rotateY(46deg) scale(.66);
      }

      .record-card[data-slot="right-near"] {
        transform: translate3d(calc(-50% + var(--near-x)), -40%, -75px) rotateY(-46deg) scale(.66);
      }

      .record-card[data-slot="left-far"] {
        transform: translate3d(calc(-50% - var(--far-x)), -27%, -250px) rotateY(68deg) scale(.46);
      }

      .record-card[data-slot="right-far"] {
        transform: translate3d(calc(-50% + var(--far-x)), -27%, -250px) rotateY(-68deg) scale(.46);
      }

      .rack-back {
        width: 97%;
        bottom: 46px;
      }

      .rack-lip {
        bottom: 2px;
      }

      .rack-front {
        bottom: 11px;
      }

      .hint {
        display: none;
      }
    }

    @media (max-height: 720px) and (min-width: 701px) {
      :root {
        --cover-size: 268px;
      }

      .player {
        padding-block: 18px;
      }

      .stage {
        height: 370px;
      }

      .transport {
        margin-top: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }

    /* 只保留转盘最后面的棕色椭圆轮廓。 */
    .orbit-shadow {
      background: transparent;
      box-shadow: none;
    }

    .orbit-shadow::before,
    .orbit-shadow::after,
    .rack-lip,
    .rack-front {
      display: none;
    }
  </style>
</head>

<body>
  <main class="player">
    <header class="brand">
      <h1>Luscinia Radio</h1>
    </header>

    <section class="stage" id="stage" aria-label="专辑唱片架">
      <div class="rack-back" aria-hidden="true"></div>
      <div class="orbit-shadow" aria-hidden="true"></div>
      <div class="records" id="records"></div>
      <div class="rack-lip" aria-hidden="true"></div>
      <div class="rack-front" aria-hidden="true"></div>
    </section>

    <section class="details" id="details" aria-live="polite">
      <div class="song-title" id="songTitle"></div>
      <div class="song-artist" id="songArtist"></div>
    </section>

    <section class="transport" aria-label="播放器控制">
      <div class="progress-row">
        <span class="time" id="currentTime">0:00</span>
        <input class="progress" id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="control" id="prevButton" type="button" aria-label="上一首">‹</button>
        <button class="control play" id="playButton" type="button" aria-label="播放">▶</button>
        <button class="control" id="nextButton" type="button" aria-label="下一首">›</button>
      </div>
    </section>

    <audio id="audio" preload="metadata"></audio>
  </main>

  <script>
    /* 以后增加或修改歌曲，只需要编辑这里。 */
    const songs = [
      {
        title: "皇后餐厅",
        artist: "王菀之",
        audio: "./music/test.mp3",
        cover: "./cover/test.jpg"
      },
      {
        title: "勇",
        artist: "杨千嬅",
        audio: "./music/test2.mp3",
        cover: "./cover/test2.jpg"
      },
      {
        title: "倾城",
        artist: "许美静",
        audio: "./music/test3.mp3",
        cover: "./cover/test3.jpg"
      },
      {
        title: "A Whole New World",
        artist: "Aladdin(Disney)",
        audio: "./music/AWholeNewWorld.mp3",
        cover: "./cover/aladdin.jpg"
      },
      {
        title: "When You Wish Upon a Star",
        artist: "Pinocchio(Disney)",
        audio: "./music/WhenYouWishUponaStar.mp3",
        cover: "./cover/pinocchio.jpg"
      }
    ];

    const stage = document.getElementById("stage");
    const records = document.getElementById("records");
    const details = document.getElementById("details");
    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const audio = document.getElementById("audio");
    const prevButton = document.getElementById("prevButton");
    const playButton = document.getElementById("playButton");
    const nextButton = document.getElementById("nextButton");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    let currentIndex = 0;
    let isSwitching = false;
    let queuedIndex = null;
    let pointerStartX = null;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function wait(milliseconds) {
      return new Promise(resolve => window.setTimeout(resolve, reduceMotion ? 0 : milliseconds));
    }

    function createRecords() {
      songs.forEach((song, index) => {
        const card = document.createElement("button");
        card.className = "record-card";
        card.type = "button";
        card.dataset.index = index;
        card.setAttribute("aria-label", `播放 ${song.title}`);

        const vinyl = document.createElement("span");
        vinyl.className = "vinyl";
        vinyl.setAttribute("aria-hidden", "true");

        const sleeve = document.createElement("span");
        sleeve.className = "sleeve";

        const image = document.createElement("img");
        image.src = song.cover;
        image.alt = `${song.title} 专辑封面`;
        image.draggable = false;

        sleeve.appendChild(image);
        card.append(vinyl, sleeve);
        card.addEventListener("click", () => {
          if (index !== currentIndex) switchSong(index, true);
        });
        records.appendChild(card);
      });
    }

    function getSlot(index, centerIndex) {
      const total = songs.length;
      let distance = (index - centerIndex + total) % total;

      if (distance > total / 2) distance -= total;

      if (distance === 0) return "center";
      if (distance === -1) return "left-near";
      if (distance === -2) return "left-far";
      if (distance === 1) return "right-near";
      if (distance === 2) return "right-far";
      return "hidden";
    }

    function applySlots(centerIndex) {
      const cards = [...records.querySelectorAll(".record-card")];
      cards.forEach((card, index) => {
        const slot = getSlot(index, centerIndex);
        card.dataset.slot = slot;
        card.tabIndex = slot === "hidden" ? -1 : 0;
        card.setAttribute("aria-current", slot === "center" ? "true" : "false");
      });
    }

    function updateDetails(index) {
      songTitle.textContent = songs[index].title;
      songArtist.textContent = songs[index].artist;
    }

    function loadAudio(index) {
      audio.src = songs[index].audio;
      audio.load();
      progress.value = 0;
      progress.style.setProperty("--progress", "0%");
      currentTime.textContent = "0:00";
      duration.textContent = "0:00";
    }

    async function switchSong(nextIndex, shouldPlay = true) {
      nextIndex = (nextIndex + songs.length) % songs.length;

      if (nextIndex === currentIndex) {
        if (shouldPlay) safePlay();
        return;
      }

      if (isSwitching) {
        queuedIndex = nextIndex;
        return;
      }

      isSwitching = true;
      queuedIndex = null;
      details.classList.add("is-changing");

      const forwardSteps = (nextIndex - currentIndex + songs.length) % songs.length;
      const backwardSteps = (currentIndex - nextIndex + songs.length) % songs.length;
      const direction = forwardSteps <= backwardSteps ? 1 : -1;
      const totalSteps = Math.min(forwardSteps, backwardSteps);

      /* 当前唱片先轻轻浮起，再回到旋转轨道。 */
      stage.classList.add("is-lifting");
      await wait(210);

      stage.classList.remove("is-lifting");
      stage.classList.add("is-rotating");

      /* 点击第二层唱片时，转盘会逐格旋转；最外侧唱片从背后绕回另一端。 */
      for (let step = 0; step < totalSteps; step += 1) {
        const cards = [...records.querySelectorAll(".record-card")];
        const wrappingSlot = direction > 0 ? "left-far" : "right-far";
        const wrappingCard = cards.find(card => card.dataset.slot === wrappingSlot);

        if (wrappingCard) wrappingCard.classList.add("is-wrapping");

        currentIndex = (currentIndex + direction + songs.length) % songs.length;
        applySlots(currentIndex);

        await wait(34);
        if (wrappingCard) wrappingCard.classList.remove("is-wrapping");
        await wait(506);
      }

      loadAudio(currentIndex);

      updateDetails(currentIndex);
      details.classList.remove("is-changing");

      /* 新的当前唱片从圆形轨道向前落位并恢复原色。 */
      stage.classList.remove("is-rotating");
      await wait(680);

      isSwitching = false;
      if (shouldPlay) safePlay();

      if (queuedIndex !== null && queuedIndex !== currentIndex) {
        const target = queuedIndex;
        queuedIndex = null;
        switchSong(target, true);
      }
    }

    function previousSong() {
      switchSong(currentIndex - 1, true);
    }

    function nextSong() {
      switchSong(currentIndex + 1, true);
    }

    function safePlay() {
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.catch === "function") {
        playPromise.catch(() => updatePlayButton(false));
      }
    }

    function togglePlay() {
      if (audio.paused) safePlay();
      else audio.pause();
    }

    function updatePlayButton(isPlaying) {
      playButton.textContent = isPlaying ? "Ⅱ" : "▶";
      playButton.classList.toggle("is-playing", isPlaying);
      playButton.setAttribute("aria-label", isPlaying ? "暂停" : "播放");
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return "0:00";
      const minutes = Math.floor(seconds / 60);
      const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${remainingSeconds}`;
    }

    prevButton.addEventListener("click", previousSong);
    nextButton.addEventListener("click", nextSong);
    playButton.addEventListener("click", togglePlay);

    audio.addEventListener("play", () => updatePlayButton(true));
    audio.addEventListener("pause", () => updatePlayButton(false));
    audio.addEventListener("ended", nextSong);
    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(audio.duration);
    });
    audio.addEventListener("timeupdate", () => {
      const percent = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      progress.value = percent;
      progress.style.setProperty("--progress", `${percent}%`);
      currentTime.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", () => {
      if (!audio.duration) return;
      audio.currentTime = (Number(progress.value) / 100) * audio.duration;
      progress.style.setProperty("--progress", `${progress.value}%`);
    });

    document.addEventListener("keydown", event => {
      const activeTag = document.activeElement?.tagName;
      if (activeTag === "INPUT") return;

      if (event.key === "ArrowLeft") previousSong();
      if (event.key === "ArrowRight") nextSong();
      if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
      }
    });

    stage.addEventListener("pointerdown", event => {
      pointerStartX = event.clientX;
    });
    stage.addEventListener("pointerup", event => {
      if (pointerStartX === null) return;
      const distance = event.clientX - pointerStartX;
      pointerStartX = null;
      if (Math.abs(distance) < 48) return;
      if (distance > 0) previousSong();
      else nextSong();
    });
    stage.addEventListener("pointercancel", () => {
      pointerStartX = null;
    });

    createRecords();
    applySlots(currentIndex);
    updateDetails(currentIndex);
    loadAudio(currentIndex);
    updatePlayButton(false);
  </script>
</body>
</html>
