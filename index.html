<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music Room</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
}

.player {
    width: 420px;

    background: white;

    border-radius: 24px;

    padding: 30px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.12);
}

h1 {
    font-size: 38px;

    margin-bottom: 28px;
}


/* 专辑封面 */

.cover {

    width: 100%;

    aspect-ratio: 1 / 1;

    border-radius: 20px;

    overflow: hidden;

    margin-bottom: 22px;

    background: #eeeeee;

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.10);
}

.cover img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* 歌曲信息 */

.song {

    background: #f3f3f5;

    border-radius: 16px;

    padding: 16px;

    cursor: pointer;

    transition: 0.25s;
}

.song:hover {

    background: #e7e7ea;

    transform: translateY(-2px);
}

.song.active {

    background: #e4e4e8;
}

.title {

    font-size: 20px;

    font-weight: 600;
}

.artist {

    margin-top: 6px;

    font-size: 15px;

    color: #888;
}


/* 播放状态 */

.now-playing {

    margin-top: 20px;

    margin-bottom: 12px;

    font-size: 15px;

    color: #666;
}


/* 原生播放器 */

audio {

    width: 100%;

    margin-top: 8px;
}

</style>

</head>


<body>


<div class="player">


    <h1>🎧 My Music Room</h1>


    <!-- 专辑封面 -->

    <div class="cover" id="cover">

        <img
            src="./cover/test.jpg"
            alt="Test Music Album Cover"
        >

    </div>


    <!-- 歌曲信息 -->

    <div class="song" id="songItem">

        <div class="title">
            Test Music
        </div>

        <div class="artist">
            Unknown
        </div>

    </div>


    <!-- 播放状态 -->

    <div
        class="now-playing"
        id="nowPlaying"
    >

        当前未播放

    </div>


    <!-- 播放器 -->

    <audio
        id="audio"
        controls
        preload="metadata"
        src="./music/test.mp3"
    >
    </audio>


</div>


<script>

const audio =
document.getElementById("audio");

const songItem =
document.getElementById("songItem");

const cover =
document.getElementById("cover");

const nowPlaying =
document.getElementById("nowPlaying");


function playSong() {

    songItem.classList.add("active");

    nowPlaying.innerHTML =
        "🎵 正在播放：<strong>Test Music</strong>";

    audio.play();

}


/* 点击歌曲信息播放 */

songItem.addEventListener(
    "click",
    playSong
);


/* 点击封面也可以播放 */

cover.addEventListener(
    "click",
    playSong
);


audio.addEventListener(
    "play",
    function () {

        songItem.classList.add("active");

        nowPlaying.innerHTML =
            "🎵 正在播放：<strong>Test Music</strong>";

    }
);


audio.addEventListener(
    "pause",
    function () {

        if (!audio.ended) {

            nowPlaying.innerHTML =
                "⏸ 已暂停：<strong>Test Music</strong>";

        }

    }
);


audio.addEventListener(
    "ended",
    function () {

        songItem.classList.remove("active");

        nowPlaying.innerHTML =
            "播放结束";

    }
);

</script>


</body>

</html>
